name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip, pdo_sqlite
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      # ✅ PASSO CRÍTICO: bootstrap + composer install no MESMO STEP
      # para o ENV valer durante o package:discover
      - name: Bootstrap ENV + Install dependencies
        shell: bash
        env:
          # Secrets principais (repo secrets). Não usa environment: DEPLOYMENT.
          PHPCLASSES_TOKEN: ${{ secrets.PHPCLASSES_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

          # Se você tiver reverb/pusher como secrets, beleza.
          # Se não tiver, o bootstrap coloca "ci" pra não quebrar o Pusher no discover.
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
          PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET }}
          PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}

          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          REVERB_HOST: ${{ secrets.REVERB_HOST }}
          REVERB_PORT: ${{ secrets.REVERB_PORT }}
          REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}

          # Composer
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: |
          set -euo pipefail

          # ✅ usa seu path REAL (sem inventar diretório)
          chmod +x scripts/ci/bootstrap-env.sh
          source scripts/ci/bootstrap-env.sh

          # SQLite (já existe no repo, mas garante no runner)
          mkdir -p database
          touch database/database.sqlite

          composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel (sqlite + key + cache)
        shell: bash
        run: |
          set -euo pipefail

          # garante que env permaneça nas próximas etapas também
          source scripts/ci/bootstrap-env.sh

          mkdir -p database
          touch database/database.sqlite

          php artisan config:clear || true
          php artisan cache:clear || true

          # Se seu projeto depende de migrations para testes:
          php artisan migrate --force || true

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/bootstrap-env.sh
          ./vendor/bin/phpunit
