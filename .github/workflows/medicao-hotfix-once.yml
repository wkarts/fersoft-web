name: Aplicar hotfix pontual de medição
on:
  push:
    branches: ['fix/medicao-whatsapp-heranca-20261013']
    paths: ['.github/workflows/medicao-hotfix-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/medicao-whatsapp-heranca-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Aplicar somente as duas substituições revisadas
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          changes = [
              ('app/Http/Controllers/ContratoEngMedicaoController.php',
               '6c0209d29bbb20d56dc6d0ea6f9cbe144f4948dc',
               b'    public function enviarWhatsapp(Request $request, $id)',
               b'    public function enviarWhatsAppMedicao(Request $request, $id)'),
              ('routes/web.php',
               'e2c6ae4376c02114a62d5bf9697b8340e8f0a3cb',
               b"'ContratoEngMedicaoController@enviarWhatsapp'",
               b"'ContratoEngMedicaoController@enviarWhatsAppMedicao'"),
          ]
          prepared = []
          for filename, expected_blob, old, new in changes:
              path = Path(filename)
              data = path.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if blob != expected_blob or data.count(old) != 1:
                  raise SystemExit('Arquivo divergiu da revisão: ' + filename)
              prepared.append((path, data.replace(old, new, 1)))
          for path, data in prepared:
              path.write_bytes(data)
          print('Duas substituições aplicadas; demais bytes preservados.')
          PY
      - name: Adicionar regressão de carregamento real e rota
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tests/Unit/ContratoEngMedicaoInheritanceTest.php
          cat > tests/Unit/ContratoEngMedicaoInheritanceTest.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Tests\Unit;

          use PHPUnit\Framework\TestCase;
          use Symfony\Component\Process\Process;

          final class ContratoEngMedicaoInheritanceTest extends TestCase
          {
              public function test_controller_loads_with_real_parent_and_distinct_whatsapp_actions(): void
              {
                  $root = dirname(__DIR__, 2);
                  $code = <<<'CODE'
          require $argv[1] . '/vendor/autoload.php';

          $controller = new ReflectionClass(\App\Http\Controllers\ContratoEngMedicaoController::class);
          $parent = \App\Http\Controllers\BaseController::class;
          if (!$controller->isSubclassOf($parent)) {
              throw new RuntimeException('A medição deve continuar herdando BaseController.');
          }

          $action = $controller->getMethod('enviarWhatsAppMedicao');
          $parameters = $action->getParameters();
          if (!$action->isPublic()
              || $action->getDeclaringClass()->getName() !== $controller->getName()
              || count($parameters) !== 2
              || (string) $parameters[0]->getType() !== \Illuminate\Http\Request::class
              || $parameters[1]->getName() !== 'id') {
              throw new RuntimeException('A ação de medição deve receber Request e id.');
          }

          $generic = $controller->getMethod('enviarWhatsApp');
          $genericParameters = $generic->getParameters();
          if ($generic->getDeclaringClass()->getName() !== $parent
              || count($genericParameters) !== 3
              || (string) $genericParameters[1]->getType() !== 'array'
              || (string) $genericParameters[2]->getType() !== 'string'
              || !$genericParameters[2]->isDefaultValueAvailable()
              || $genericParameters[2]->getDefaultValue() !== '') {
              throw new RuntimeException('O contrato genérico de WhatsApp do BaseController foi alterado.');
          }

          echo "MEDICAO_HERANCA_OK\n";
          CODE;

                  // Autoload em subprocesso detecta FatalError sem derrubar toda a suíte.
                  // Não instancia controller, não consulta banco e não envia mensagens.
                  $process = new Process([
                      PHP_BINARY, '-d', 'display_errors=stderr', '-r', $code, $root,
                  ], $root);
                  $process->setTimeout(30);
                  $process->run();

                  $this->assertSame(
                      0,
                      $process->getExitCode(),
                      $process->getErrorOutput() . $process->getOutput()
                  );
                  $this->assertSame("MEDICAO_HERANCA_OK\n", $process->getOutput());
              }

              public function test_existing_whatsapp_url_and_route_name_point_to_measurement_action(): void
              {
                  $routes = file_get_contents(dirname(__DIR__, 2) . '/routes/web.php');
                  $this->assertIsString($routes);
                  $this->assertStringContainsString(
                      "['prefix' => 'contratos/medicoes', 'middleware' => 'verificaEmpresa']",
                      $routes
                  );
                  $this->assertStringContainsString(
                      "Route::get('/enviar-whatsapp/{id}', 'ContratoEngMedicaoController@enviarWhatsAppMedicao')->name('contratos.medicoes.whatsapp');",
                      $routes
                  );
                  $this->assertStringNotContainsString(
                      "ContratoEngMedicaoController@enviarWhatsapp'",
                      $routes
                  );
              }
          }
          PHP
          git diff --check
          git diff --numstat -- app/Http/Controllers/ContratoEngMedicaoController.php routes/web.php
      - name: Gravar correção e remover esta automação temporária
        shell: bash
        run: |
          set -euo pipefail
          git add app/Http/Controllers/ContratoEngMedicaoController.php routes/web.php tests/Unit/ContratoEngMedicaoInheritanceTest.php
          git rm .github/workflows/medicao-hotfix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(contratos): evitar colisão da ação WhatsApp da medição com BaseController'
          git push origin HEAD:refs/heads/fix/medicao-whatsapp-heranca-20261013
