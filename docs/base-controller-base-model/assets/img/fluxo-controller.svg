<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Fluxo BaseController">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .title{font:700 18px Arial;fill:#0f172a}
      .txt{font:15px Arial;fill:#334155}
      .arrow{stroke:#0ea5e9;stroke-width:3;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc"/>

  <rect class="box" x="50" y="180" rx="10" ry="10" width="160" height="80"/>
  <text class="title" x="72" y="225">Requisição</text>

  <rect class="box" x="260" y="120" rx="10" ry="10" width="190" height="80"/>
  <text class="title" x="278" y="155">Middleware</text>
  <text class="txt" x="280" y="178">Sessão + tenant</text>

  <rect class="box" x="260" y="280" rx="10" ry="10" width="190" height="80"/>
  <text class="title" x="303" y="315">Validação</text>
  <text class="txt" x="281" y="338">rules/messages</text>

  <rect class="box" x="500" y="120" rx="10" ry="10" width="210" height="80"/>
  <text class="title" x="535" y="155">list/register</text>
  <text class="txt" x="530" y="178">monta view</text>

  <rect class="box" x="500" y="280" rx="10" ry="10" width="210" height="80"/>
  <text class="title" x="542" y="315">save/delete</text>
  <text class="txt" x="532" y="338">persistência</text>

  <rect class="box" x="760" y="120" rx="10" ry="10" width="190" height="80"/>
  <text class="title" x="792" y="155">Resposta</text>
  <text class="txt" x="786" y="178">View/Redirect</text>

  <rect class="box" x="760" y="280" rx="10" ry="10" width="190" height="80"/>
  <text class="title" x="802" y="315">LogService</text>
  <text class="txt" x="781" y="338">auditoria manual</text>

  <line class="arrow" x1="210" y1="220" x2="260" y2="160"/>
  <line class="arrow" x1="210" y1="220" x2="260" y2="320"/>
  <line class="arrow" x1="450" y1="160" x2="500" y2="160"/>
  <line class="arrow" x1="450" y1="320" x2="500" y2="320"/>
  <line class="arrow" x1="710" y1="160" x2="760" y2="160"/>
  <line class="arrow" x1="710" y1="320" x2="760" y2="320"/>
</svg>
