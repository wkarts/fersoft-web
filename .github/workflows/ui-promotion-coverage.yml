name: UI Visual - Gate final de cobertura

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  coverage:
    # Somente promoção DEFINITIVA develop -> main, após a fase standard.
    # PRs em draft e PRs funcionais comuns não são afetadas.
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && vars.UI_FLOW_PHASE == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP para auditoria sem banco
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validar as três ferramentas da cobertura
        run: |
          set -euo pipefail
          php -l scripts/auditar-tema.php
          php -l scripts/auditar-assets.php
          php -l scripts/ui/coverage-report.php
      - name: Validar todos os Blades e assets antes da promoção
        run: |
          set -euo pipefail
          mkdir -p storage/app
          php scripts/auditar-tema.php --out=storage/app/tema-inventario.json
          php scripts/auditar-assets.php --out=storage/app/tema-assets.json
          php scripts/ui/coverage-report.php --require-complete \
            --out=storage/app/tema-cobertura.json \
            --csv=storage/app/tema-cobertura.csv
      - name: Anexar evidências de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-final-${{ github.run_id }}
          path: |
            storage/app/tema-cobertura.json
            storage/app/tema-cobertura.csv
          if-no-files-found: warn
          retention-days: 30
