name: UI - Preparar fontes na branch isolada
on:
  push:
    branches: [feat/ui-operational-redesign-20261015]
    paths:
      - '.github/ui-native-fix.py'
      - '.github/workflows/ui-native-bootstrap.yml'
permissions:
  contents: write
concurrency:
  group: ui-native-source-transport
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'wkarts/fersoft-web' && github.ref == 'refs/heads/feat/ui-operational-redesign-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      COMPOSER_NO_AUDIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compilar fontes e aplicar correção pontual validada
        run: |
          set -euo pipefail
          python .github/ui-native-fix.py
          python scripts/ci/build-native-ui.py
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): corrigir diretivas de tema e verificar renderização Blade'
            git push origin HEAD:refs/heads/feat/ui-operational-redesign-20261015
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip, bcmath
          coverage: none
      - name: Renderizar fontes Blade no Laravel real
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/{views,cache,sessions} storage/logs storage/app/ui-browser
          cp .env.example .env
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          composer install --prefer-dist --no-interaction --no-progress --quiet
          php artisan config:clear
          php artisan view:cache
          vendor/bin/phpunit --filter UiNativePaletteTest
          php tests/ui/render-native.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-native-first-render-${{ github.run_id }}
          path: |
            storage/app/ui-browser/
            storage/logs/laravel.log
          if-no-files-found: warn
          retention-days: 7
