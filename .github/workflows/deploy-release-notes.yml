name: Deploy Release Notes

on:
  workflow_run:
    workflows: ['Release - Automático e Manual']
    branches: [main]
    types: [completed]
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: 'Versão semântica (ex: 1.4.2 ou v1.4.2)'
        required: true
        type: string
      ref:
        description: 'Tag/branch para checkout no servidor (opcional)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semântica (ex: 5.0.23 ou v5.0.23)'
        required: true
        type: string
      ref:
        description: 'Tag/branch para checkout no servidor (opcional)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-release-notes
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name != 'release' || github.event.release.prerelease == false) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.target.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolver a release desta execução
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.release.tag_name || inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_run ]]; then
            # O nome do artefato identifica a versão inclusive em reexecuções antigas.
            artifact_names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')
            mapfile -t artifacts < <(printf '%s\n' "$artifact_names" | grep '^app-release-' || true)
            if (( ${#artifacts[@]} != 1 )); then
              echo "::error::Esperado um artefato de release no run $RUN_ID."
              exit 1
            fi
            TAG=${artifacts[0]#app-release-}
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            if jq -e '.prerelease or .draft' <<< "$metadata" >/dev/null; then
              echo "Pré-release ou rascunho: deploy estável dispensado." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            if [[ "$commit" != "$EXPECTED_SHA" ]]; then
              echo "::error::A tag publicada não aponta para o commit validado."
              exit 1
            fi
            INPUT_REF=$commit
          fi
          version=${TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versão estável inválida."; exit 1; }
          ref=${INPUT_REF:-$TAG}
          git check-ref-format --allow-onelevel "$ref" && [[ "$ref" != -* ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Conferir destino SSH
        id: target
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_DIR: ${{ secrets.DEPLOY_APP_DIR != '' }}
          HAS_PORT: ${{ secrets.DEPLOY_PORT != '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != workflow_dispatch && "$HAS_HOST$HAS_USER$HAS_KEY$HAS_DIR$HAS_PORT" == falsefalsefalsefalsefalse ]]; then
            echo "Destino SSH não configurado. Release disponível no GitHub." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ "$HAS_HOST" == true ]] || missing+=(DEPLOY_HOST)
          [[ "$HAS_USER" == true ]] || missing+=(DEPLOY_USER)
          [[ "$HAS_KEY" == true ]] || missing+=(DEPLOY_SSH_KEY)
          [[ "$HAS_DIR" == true ]] || missing+=(DEPLOY_APP_DIR)
          if (( ${#missing[@]} )); then
            echo "::error::Destino SSH incompleto. Configurar: ${missing[*]}"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar notas da release para o registro local
        id: notes
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body || '' }}
          MANUAL_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          body="${RELEASE_BODY:-Release ${MANUAL_VERSION:-manual} aplicada pelo fluxo de release.}"
          notes_b64="$(printf '%s' "$body" | base64 -w 0)"
          echo "notes_b64=$notes_b64" >> "$GITHUB_OUTPUT"

      - name: Deploy remoto (idempotente)
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_NOTES_B64: ${{ steps.notes.outputs.notes_b64 }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: RELEASE_NOTES_B64,APP_DIR,VERSION,REF
          script: |
            set -euo pipefail

            cd "$APP_DIR"

            {
              flock -n 9 || { echo "Deploy em execução. Abortando."; exit 1; }

              git fetch --all --tags --prune
              git checkout --detach "$(git rev-parse --verify --end-of-options "$REF^{commit}")"

              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

              export RELEASE_VERSION="$VERSION"

              php <<'PHP'
              <?php
              $encoded = getenv('RELEASE_NOTES_B64') ?: '';
              $notes = base64_decode($encoded, true);
              if ($notes === false) {
                  fwrite(STDERR, "Notas da release inválidas.\n");
                  exit(1);
              }

              $version = getenv('RELEASE_VERSION') ?: '';
              $safeTitle = htmlspecialchars('Release '.$version, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
              $safeNotes = htmlspecialchars($notes, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
              $html = '<!doctype html><html><head><meta charset="utf-8"></head><body><h1>'
                  .$safeTitle.'</h1><pre>'.$safeNotes.'</pre></body></html>';
              $notesPath = 'storage/app/releases/'.$version.'/current.html';
              $notesDirectory = dirname($notesPath);
              if (!is_dir($notesDirectory) && !mkdir($notesDirectory, 0775, true) && !is_dir($notesDirectory)) {
                  fwrite(STDERR, "Não foi possível criar o diretório das notas.\n");
                  exit(1);
              }
              if (file_put_contents($notesPath, $html) === false) {
                  fwrite(STDERR, "Não foi possível gravar as notas HTML.\n");
                  exit(1);
              }
              PHP

              php artisan app-version:apply-release "$VERSION" \
                --manifest=storage/app/releases/manifest.json \
                --notes-current-html-file="storage/app/releases/$VERSION/current.html" \
                --title="Release $VERSION" \
                --release-channel=stable \
                --build-number="${{ github.run_id }}" \
                --commit-hash="$(git rev-parse HEAD)" \
                --author="Wallace Kleiton <wkarts@gmail.com>"

              php -r '$v=json_decode(file_get_contents("composer.json"), true)["version"] ?? ""; if($v !== getenv("RELEASE_VERSION")){fwrite(STDERR, "composer.json fora de sincronia\n"); exit(1);} echo "composer.json sincronizado: {$v}\n";'
            } 9>/tmp/fersoft-release-notes.lock
