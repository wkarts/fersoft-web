name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      - name: Configure PHPClasses Auth (COMPOSER_AUTH)
        shell: bash
        run: |
          if [ -z "${{ secrets.PHPCLASSES_TOKEN }}" ]; then
            echo "ERROR: Secret PHPCLASSES_TOKEN is missing/empty"
            exit 1
          fi
          echo 'COMPOSER_AUTH={"http-basic":{"www.phpclasses.org":{"username":"wkarts","password":"${{ secrets.PHPCLASSES_TOKEN }}"},"phpclasses.org":{"username":"wkarts","password":"${{ secrets.PHPCLASSES_TOKEN }}"}}}' >> $GITHUB_ENV

      - name: Export optional repo vars/secrets
        run: |
          echo "PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" >> $GITHUB_ENV
          echo "PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}" >> $GITHUB_ENV
          echo "PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}" >> $GITHUB_ENV
          echo "PUSHER_APP_CLUSTER=${{ vars.PUSHER_APP_CLUSTER }}" >> $GITHUB_ENV

          echo "REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}" >> $GITHUB_ENV
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> $GITHUB_ENV
          echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> $GITHUB_ENV
          echo "REVERB_HOST=${{ vars.REVERB_HOST }}" >> $GITHUB_ENV
          echo "REVERB_PORT=${{ vars.REVERB_PORT }}" >> $GITHUB_ENV
          echo "REVERB_SCHEME=${{ vars.REVERB_SCHEME }}" >> $GITHUB_ENV

          echo "EVO_BASE_URL=${{ vars.EVO_BASE_URL }}" >> $GITHUB_ENV
          echo "EVO_GLOBAL_API=${{ secrets.EVO_GLOBAL_API }}" >> $GITHUB_ENV
          echo "EVO_API_VERSION=${{ vars.EVO_API_VERSION }}" >> $GITHUB_ENV
          echo "EVO_DDI=${{ vars.EVO_DDI }}" >> $GITHUB_ENV
          echo "EVO_DDD=${{ vars.EVO_DDD }}" >> $GITHUB_ENV

      - name: Bootstrap CI env (fallbacks)
        run: |
          bash scripts/ci/bootstrap-env.sh

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
        run: |
          ./vendor/bin/phpunit
