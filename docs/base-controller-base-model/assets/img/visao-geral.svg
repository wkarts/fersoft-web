<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Visão geral de fluxo">
  <defs>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .t{font:600 20px Arial;fill:#1f2937}
      .s{font:16px Arial;fill:#475569}
      .line{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#f8fafc"/>
  <rect class="box" x="60" y="150" rx="12" ry="12" width="190" height="120"/>
  <text class="t" x="95" y="205">Request HTTP</text>

  <rect class="box" x="300" y="120" rx="12" ry="12" width="230" height="180"/>
  <text class="t" x="340" y="175">BaseController</text>
  <text class="s" x="330" y="210">- Tenant (empresa/filial)</text>
  <text class="s" x="330" y="235">- Validação &amp; filtros</text>
  <text class="s" x="330" y="260">- Fluxo CRUD</text>

  <rect class="box" x="590" y="120" rx="12" ry="12" width="220" height="180"/>
  <text class="t" x="640" y="175">BaseModel</text>
  <text class="s" x="620" y="210">- Eventos de ciclo</text>
  <text class="s" x="620" y="235">- Auditoria automática</text>
  <text class="s" x="620" y="260">- Soft delete custom</text>

  <rect class="box" x="870" y="80" rx="12" ry="12" width="250" height="110"/>
  <text class="t" x="920" y="135">Banco de Dados</text>

  <rect class="box" x="870" y="230" rx="12" ry="12" width="250" height="110"/>
  <text class="t" x="945" y="285">LogService</text>

  <line class="line" x1="250" y1="210" x2="300" y2="210"/>
  <line class="line" x1="530" y1="210" x2="590" y2="210"/>
  <line class="line" x1="810" y1="170" x2="870" y2="140"/>
  <line class="line" x1="810" y1="250" x2="870" y2="285"/>
</svg>
