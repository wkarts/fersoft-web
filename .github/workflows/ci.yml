name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      # 1) Exporta secrets como ENV do job (pra o script conseguir montar .env)
      - name: Export Secrets to ENV
        shell: bash
        run: |
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> $GITHUB_ENV

          echo "PHPCLASSES_TOKEN=${{ secrets.PHPCLASSES_TOKEN }}" >> $GITHUB_ENV
          echo "REPOSITORY_PERSONAL_TOKEN=${{ secrets.REPOSITORY_PERSONAL_TOKEN }}" >> $GITHUB_ENV

          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $GITHUB_ENV
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> $GITHUB_ENV
          echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> $GITHUB_ENV
          echo "SMTP_TO=${{ secrets.SMTP_TO }}" >> $GITHUB_ENV

          echo "WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}" >> $GITHUB_ENV
          echo "WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}" >> $GITHUB_ENV

          echo "REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}" >> $GITHUB_ENV
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> $GITHUB_ENV
          echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> $GITHUB_ENV

          echo "PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" >> $GITHUB_ENV
          echo "PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}" >> $GITHUB_ENV
          echo "PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}" >> $GITHUB_ENV

          echo "EVO_DDI=${{ secrets.EVO_DDI }}" >> $GITHUB_ENV
          echo "EVO_DDD=${{ secrets.EVO_DDD }}" >> $GITHUB_ENV
          echo "EVO_BASE_URL=${{ secrets.EVO_BASE_URL }}" >> $GITHUB_ENV
          echo "EVO_GLOBAL_API=${{ secrets.EVO_GLOBAL_API }}" >> $GITHUB_ENV
          echo "EVO_API_VERSION=${{ secrets.EVO_API_VERSION }}" >> $GITHUB_ENV
          echo "EVO_QR_LOGO_BASE64=${{ secrets.EVO_QR_LOGO_BASE64 }}" >> $GITHUB_ENV
          echo "EVO_QR_LOGO_SIZE=${{ secrets.EVO_QR_LOGO_SIZE }}" >> $GITHUB_ENV
          echo "EVO_TOKEN_PREFIX=${{ secrets.EVO_TOKEN_PREFIX }}" >> $GITHUB_ENV
          echo "EVO_TOKEN_ALPHABET=${{ secrets.EVO_TOKEN_ALPHABET }}" >> $GITHUB_ENV
          echo "EVO_WHATSAPP_MODAL_HINTBUTTON=${{ secrets.EVO_WHATSAPP_MODAL_HINTBUTTON }}" >> $GITHUB_ENV
          echo "EVO_WHATSAPP_MODAL_TITLE=${{ secrets.EVO_WHATSAPP_MODAL_TITLE }}" >> $GITHUB_ENV
          echo "EVO_WHATSAPP_MODAL_HINTFOOTER=${{ secrets.EVO_WHATSAPP_MODAL_HINTFOOTER }}" >> $GITHUB_ENV

      # 2) Gera .env integral e força CI safe settings (BROADCAST_DRIVER=log)
      - name: Bootstrap .env (integral) for CI
        shell: bash
        run: |
          chmod +x scripts/ci/bootstrap-env.sh
          scripts/ci/bootstrap-env.sh

      # 3) Auth do PHPClasses via COMPOSER_AUTH (depende do secret PHPCLASSES_TOKEN)
      - name: Configure PHPClasses Auth (COMPOSER_AUTH)
        shell: bash
        run: |
          if [ -z "${PHPCLASSES_TOKEN:-}" ]; then
            echo "ERROR: Secret PHPCLASSES_TOKEN is missing/empty"
            exit 1
          fi

          echo 'COMPOSER_AUTH={"http-basic":{"www.phpclasses.org":{"username":"wkarts","password":"'"${PHPCLASSES_TOKEN}"'"},"phpclasses.org":{"username":"wkarts","password":"'"${PHPCLASSES_TOKEN}"'"}}}' >> $GITHUB_ENV

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
        run: |
          ./vendor/bin/phpunit
