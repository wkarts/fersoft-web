name: Deploy Release Notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semântica (ex: 5.0.23 ou v5.0.23)'
        required: true
        type: string
      ref:
        description: 'Tag/branch para checkout no servidor (opcional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-release-notes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            raw="${{ github.event.release.tag_name }}"
          else
            raw="${{ inputs.version }}"
          fi

          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $raw"
            exit 1
          fi

          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="$raw"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Deploy remoto (idempotente)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            VERSION="${{ steps.version.outputs.version }}"
            REF="${{ steps.version.outputs.ref }}"

            cd "$APP_DIR"

            {
              flock -n 9 || { echo "Deploy em execução. Abortando."; exit 1; }

              git fetch --all --tags --prune
              git checkout "$REF"

              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

              export RELEASE_VERSION="$VERSION"

              php artisan app-version:apply-release "$VERSION" \
                --manifest=storage/app/releases/manifest.json \
                --notes-current-html-file="storage/app/releases/$VERSION/current.html" \
                --title="Release $VERSION" \
                --release-channel=stable \
                --build-number="${{ github.run_id }}" \
                --commit-hash="${{ github.sha }}" \
                --author="Wallace Kleiton <wkarts@gmail.com>"

              php -r '$v=json_decode(file_get_contents("composer.json"), true)["version"] ?? ""; if($v !== getenv("RELEASE_VERSION")){fwrite(STDERR, "composer.json fora de sincronia\n"); exit(1);} echo "composer.json sincronizado: {$v}\n";'
            } 9>/tmp/fersoft-release-notes.lock
