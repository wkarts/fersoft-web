name: Deploy Release Notes

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: 'Versão semântica (ex: 1.4.2 ou v1.4.2)'
        required: true
        type: string
      ref:
        description: 'Tag/branch para checkout no servidor (opcional)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semântica (ex: 5.0.23 ou v5.0.23)'
        required: true
        type: string
      ref:
        description: 'Tag/branch para checkout no servidor (opcional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-release-notes
  cancel-in-progress: false

jobs:
  deploy:
    # As pré-releases do tema visual nunca podem acionar o deploy estável.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolver versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            raw="${{ github.event.release.tag_name }}"
          else
            raw="${{ inputs.version }}"
          fi

          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $raw"
            exit 1
          fi

          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="$raw"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Preparar notas da release para o registro local
        id: notes
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body || '' }}
          MANUAL_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          body="${RELEASE_BODY:-Release ${MANUAL_VERSION:-manual} aplicada pelo fluxo de release.}"
          notes_b64="$(printf '%s' "$body" | base64 -w 0)"
          echo "notes_b64=$notes_b64" >> "$GITHUB_OUTPUT"

      - name: Deploy remoto (idempotente)
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_NOTES_B64: ${{ steps.notes.outputs.notes_b64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: RELEASE_NOTES_B64
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            VERSION="${{ steps.version.outputs.version }}"
            REF="${{ steps.version.outputs.ref }}"

            cd "$APP_DIR"

            {
              flock -n 9 || { echo "Deploy em execução. Abortando."; exit 1; }

              git fetch --all --tags --prune
              git checkout "$REF"

              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

              export RELEASE_VERSION="$VERSION"

              php <<'PHP'
              <?php
              $encoded = getenv('RELEASE_NOTES_B64') ?: '';
              $notes = base64_decode($encoded, true);
              if ($notes === false) {
                  fwrite(STDERR, "Notas da release inválidas.\n");
                  exit(1);
              }

              $version = getenv('RELEASE_VERSION') ?: '';
              $safeTitle = htmlspecialchars('Release '.$version, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
              $safeNotes = htmlspecialchars($notes, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
              $html = '<!doctype html><html><head><meta charset="utf-8"></head><body><h1>'
                  .$safeTitle.'</h1><pre>'.$safeNotes.'</pre></body></html>';
              $notesPath = 'storage/app/releases/'.$version.'/current.html';
              $notesDirectory = dirname($notesPath);
              if (!is_dir($notesDirectory) && !mkdir($notesDirectory, 0775, true) && !is_dir($notesDirectory)) {
                  fwrite(STDERR, "Não foi possível criar o diretório das notas.\n");
                  exit(1);
              }
              if (file_put_contents($notesPath, $html) === false) {
                  fwrite(STDERR, "Não foi possível gravar as notas HTML.\n");
                  exit(1);
              }
              PHP

              php artisan app-version:apply-release "$VERSION" \
                --manifest=storage/app/releases/manifest.json \
                --notes-current-html-file="storage/app/releases/$VERSION/current.html" \
                --title="Release $VERSION" \
                --release-channel=stable \
                --build-number="${{ github.run_id }}" \
                --commit-hash="${{ github.sha }}" \
                --author="Wallace Kleiton <wkarts@gmail.com>"

              php -r '$v=json_decode(file_get_contents("composer.json"), true)["version"] ?? ""; if($v !== getenv("RELEASE_VERSION")){fwrite(STDERR, "composer.json fora de sincronia\n"); exit(1);} echo "composer.json sincronizado: {$v}\n";'
            } 9>/tmp/fersoft-release-notes.lock
