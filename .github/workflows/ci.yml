name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      # ✅ Gera ENCRYPTION_KEY dinamicamente no CI (não depende de secret)
      - name: Generate ENCRYPTION_KEY for CI
        run: |
          KEY=$(php -r "echo 'base64:'.base64_encode(random_bytes(32));")
          echo "ENCRYPTION_KEY=$KEY" >> $GITHUB_ENV

      # ✅ Evita quebra no package:discover quando Broadcast/Pusher é carregado sem env
      - name: Set minimal Broadcast/Pusher env for CI
        run: |
          echo "BROADCAST_CONNECTION=log" >> $GITHUB_ENV
          echo "BROADCAST_DRIVER=log" >> $GITHUB_ENV
          echo "PUSHER_APP_ID=ci" >> $GITHUB_ENV
          echo "PUSHER_APP_KEY=ci" >> $GITHUB_ENV
          echo "PUSHER_APP_SECRET=ci" >> $GITHUB_ENV
          echo "PUSHER_APP_CLUSTER=mt1" >> $GITHUB_ENV

      # ✅ Auth do PHPClasses via COMPOSER_AUTH (depende do Repository secret PHPCLASSES_TOKEN)
      - name: Configure PHPClasses Auth (COMPOSER_AUTH)
        shell: bash
        run: |
          if [ -z "${{ secrets.PHPCLASSES_TOKEN }}" ]; then
            echo "ERROR: Secret PHPCLASSES_TOKEN is missing/empty"
            exit 1
          fi

          echo 'COMPOSER_AUTH={"http-basic":{"www.phpclasses.org":{"username":"wkarts","password":"${{ secrets.PHPCLASSES_TOKEN }}"},"phpclasses.org":{"username":"wkarts","password":"${{ secrets.PHPCLASSES_TOKEN }}"}}}' >> $GITHUB_ENV

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
        run: |
          ./vendor/bin/phpunit
