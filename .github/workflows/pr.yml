name: PR - Validação e Qualidade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_composer: ${{ steps.detect.outputs.has_composer }}
      has_package: ${{ steps.detect.outputs.has_package }}
      has_phpunit: ${{ steps.detect.outputs.has_phpunit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar stack disponível
        id: detect
        shell: bash
        run: |
          echo "has_composer=$([ -f composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_package=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_phpunit=$([ -f vendor/bin/phpunit ] || [ -f phpunit.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  php:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_composer == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer validate
        run: composer validate --no-check-publish --strict

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP version
        run: php -v

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo PHP encontrado para lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}" | xargs -n1 -P4 php -l >/dev/null
          echo "Lint PHP concluído com sucesso."

      - name: PHPUnit
        shell: bash
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit --testdox
          elif [ -f artisan ]; then
            php artisan test --parallel
          else
            echo "Nenhum runner de teste PHP encontrado; etapa ignorada."
          fi

  node:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_package == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Testes Node (se existir)
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "Script npm test não encontrado; etapa ignorada."
          fi

      - name: Build Node (se existir)
        shell: bash
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "Script npm build não encontrado; etapa ignorada."
          fi

  security:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        target: [composer, npm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.target == 'composer' && needs.setup.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node
        if: matrix.target == 'npm' && needs.setup.outputs.has_package == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Security Audit Composer (warning-only)
        if: matrix.target == 'composer' && needs.setup.outputs.has_composer == 'true'
        continue-on-error: true
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer audit

      - name: Security Audit NPM (warning-only)
        if: matrix.target == 'npm' && needs.setup.outputs.has_package == 'true'
        continue-on-error: true
        run: |
          npm ci
          npm audit --audit-level=high

  summary:
    runs-on: ubuntu-latest
    needs: [setup, php, node, security]
    if: always()
    steps:
      - name: Sumário do PR
        run: |
          {
            echo "## Resultado do pipeline de PR"
            echo ""
            echo "- Setup: ${{ needs.setup.result }}"
            echo "- PHP: ${{ needs.php.result }}"
            echo "- Node: ${{ needs.node.result }}"
            echo "- Security: ${{ needs.security.result }}"
            echo ""
            echo "Este workflow falha automaticamente quando jobs críticos falham, bloqueando merge quando configurado como check obrigatório no branch protection."
          } >> "$GITHUB_STEP_SUMMARY"
