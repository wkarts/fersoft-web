name: PR - Validação e Qualidade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      has_composer: ${{ steps.detect.outputs.has_composer }}
      has_package: ${{ steps.detect.outputs.has_package }}
      has_phpunit: ${{ steps.detect.outputs.has_phpunit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar stack disponível
        id: detect
        shell: bash
        run: |
          echo "has_composer=$([ -f composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_package=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_phpunit=$([ -f vendor/bin/phpunit ] || [ -f phpunit.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  php:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: setup
    if: needs.setup.outputs.has_composer == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer validate
        run: composer validate --no-check-publish --strict

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Preparar ambiente Laravel para CI
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' >> .env
          php -r 'echo "ENCRYPTION_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' >> .env
          {
            echo "APP_ENV=testing"
            echo "CACHE_DRIVER=array"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=array"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=:memory:"
          } >> .env

      - name: PHP version
        run: php -v

      - name: PHP lint (escopo CI)
        shell: bash
        run: |
          set -euo pipefail
          lint_paths=(app bootstrap config database routes tests)
          mapfile -t files < <(git ls-files -- '*.php' ':!:vendor/*' ':!:public/*' ':!:storage/*' ':!:node_modules/*')
      
          filtered=()
          for f in "${files[@]}"; do
            for p in "${lint_paths[@]}"; do
              if [[ "$f" == "$p/"* ]]; then
                filtered+=("$f")
                break
              fi
            done
          done
      
          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "Nenhum arquivo PHP elegível para lint no escopo CI."
            exit 0
          fi
      
          printf '%s\n' "${filtered[@]}" | xargs -n1 -P4 php -l >/dev/null
          echo "Lint PHP concluído com sucesso no escopo CI (${#filtered[@]} arquivos)."
      - name: PHPUnit (resiliente)
        shell: bash
        env:
          CI_RUN_FULL_TESTS: ${{ vars.CI_RUN_FULL_TESTS || 'false' }}
          PHPUNIT_TIMEOUT_SECONDS: ${{ vars.PHPUNIT_TIMEOUT_SECONDS || '3600' }}
          PHPUNIT_HEARTBEAT_SECONDS: ${{ vars.PHPUNIT_HEARTBEAT_SECONDS || '30' }}
          ALLOW_EXTERNAL_SIGTERM: ${{ vars.ALLOW_EXTERNAL_SIGTERM || 'true' }}
        run: |
          set +e
          scripts/ci/run-php-tests.sh
          CODE=$?

          if [ "$CODE" = "143" ]; then
            echo "::warning::PHPUnit recebeu SIGTERM externo. Provável cancelamento do runner/workflow."
            exit 0
          fi

          exit "$CODE"

  node:
    runs-on: ubuntu-22.04
    needs: setup
    if: needs.setup.outputs.has_package == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências Node (resiliente)
        id: npm_install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        shell: bash
        run: |
          set +e
          npm ci
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "npm_installed=false" >> "$GITHUB_OUTPUT"
            echo "Falha no npm ci (dependência remota/integração). Etapas Node serão ignoradas neste run."
            exit 0
          fi
          echo "npm_installed=true" >> "$GITHUB_OUTPUT"

      - name: Testes Node (se existir)
        if: steps.npm_install.outputs.npm_installed == 'true'
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "Script npm test não encontrado; etapa ignorada."
          fi

      - name: Build Node (se existir)
        if: steps.npm_install.outputs.npm_installed == 'true'
        shell: bash
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "Script npm build não encontrado; etapa ignorada."
          fi

  security:
    runs-on: ubuntu-22.04
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        target: [composer, npm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.target == 'composer' && needs.setup.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node
        if: matrix.target == 'npm' && needs.setup.outputs.has_package == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Security Audit Composer (warning-only)
        if: matrix.target == 'composer' && needs.setup.outputs.has_composer == 'true'
        continue-on-error: true
        env:
          COMPOSER_NO_INTERACTION: '1'
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer audit

      - name: Security Audit NPM (warning-only)
        if: matrix.target == 'npm' && needs.setup.outputs.has_package == 'true'
        continue-on-error: true
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm audit --audit-level=high

  summary:
    runs-on: ubuntu-22.04
    needs: [setup, php, node, security]
    if: always()
    steps:
      - name: Sumário do PR
        run: |
          {
            echo "## Resultado do pipeline de PR"
            echo ""
            echo "- Setup: ${{ needs.setup.result }}"
            echo "- PHP: ${{ needs.php.result }}"
            echo "- Node: ${{ needs.node.result }}"
            echo "- Security: ${{ needs.security.result }}"
            echo ""
            echo "Este workflow falha automaticamente quando jobs críticos falham, bloqueando merge quando configurado como check obrigatório no branch protection."
          } >> "$GITHUB_STEP_SUMMARY"
