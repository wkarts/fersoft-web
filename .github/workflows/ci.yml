name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      # ======================================================
      # BOOTSTRAP ÚNICO (para TODOS os workflows/jobs)
      # - Cria .env a partir do .env.ci
      # - Exporta variáveis pro runner ($GITHUB_ENV)
      # - Gera ENCRYPTION_KEY / APP_KEY
      # - Seta defaults para não quebrar package:discover
      # - Configura COMPOSER_AUTH (PHPClasses)
      # ======================================================
      - name: Bootstrap env (CI)
        shell: bash
        env:
          # Secrets do repo (não precisa "environment: DEPLOYMENT")
          PHPCLASSES_TOKEN: ${{ secrets.PHPCLASSES_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

          # SMTP
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

          # Webhook / Repo token
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REPOSITORY_PERSONAL_TOKEN: ${{ secrets.REPOSITORY_PERSONAL_TOKEN }}

          # EVO
          EVO_DDI: ${{ secrets.EVO_DDI }}
          EVO_DDD: ${{ secrets.EVO_DDD }}
          EVO_BASE_URL: ${{ secrets.EVO_BASE_URL }}
          EVO_GLOBAL_API: ${{ secrets.EVO_GLOBAL_API }}
          EVO_API_VERSION: ${{ secrets.EVO_API_VERSION }}
          EVO_QR_LOGO_BASE64: ${{ secrets.EVO_QR_LOGO_BASE64 }}
          EVO_QR_LOGO_SIZE: ${{ secrets.EVO_QR_LOGO_SIZE }}
          EVO_TOKEN_PREFIX: ${{ secrets.EVO_TOKEN_PREFIX }}
          EVO_TOKEN_ALPHABET: ${{ secrets.EVO_TOKEN_ALPHABET }}
          EVO_WHATSAPP_MODAL_HINTBUTTON: ${{ secrets.EVO_WHATSAPP_MODAL_HINTBUTTON }}
          EVO_WHATSAPP_MODAL_TITLE: ${{ secrets.EVO_WHATSAPP_MODAL_TITLE }}
          EVO_WHATSAPP_MODAL_HINTFOOTER: ${{ secrets.EVO_WHATSAPP_MODAL_HINTFOOTER }}

          # Reverb / Vite / Pusher (se você colocou em secrets)
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          REVERB_HOST: ${{ secrets.REVERB_HOST }}
          REVERB_PORT: ${{ secrets.REVERB_PORT }}
          REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}

          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
          PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET }}
          PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}

          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
          VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_HOST: ${{ secrets.VITE_PUSHER_HOST }}
          VITE_PUSHER_PORT: ${{ secrets.VITE_PUSHER_PORT }}
          VITE_PUSHER_SCHEME: ${{ secrets.VITE_PUSHER_SCHEME }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}

          # Defaults CI (pode deixar assim)
          APP_ENV: testing
          APP_DEBUG: "true"
          BROADCAST_DRIVER: log
          BROADCAST_CONNECTION: log
        run: |
          chmod +x scripts/ci/bootstrap-env.sh
          scripts/ci/bootstrap-env.sh

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit
