name: Release - Identidade instalada

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  release-identity:
    name: Contrato da versao instalada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provar contrato do pacote e incremento estavel
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
          python3 tests/ui/test-main-version-identity-sync.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo_sqlite, mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip, bcmath, soap
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-release-identity-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-release-identity-

      - name: Instalar dependencias para testes isolados
        env:
          PHPCLASSES_TOKEN: ${{ secrets.PHPCLASSES_TOKEN }}
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_NO_AUDIT: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PHPCLASSES_TOKEN:-}" ]; then
            export COMPOSER_AUTH="$(python3 - <<'PY'
          import json, os
          credentials = {"username": "wkarts", "password": os.environ["PHPCLASSES_TOKEN"]}
          print(json.dumps({"http-basic": {host: credentials for host in ["www.phpclasses.org", "phpclasses.org"]}}))
          PY
          )"
          fi
          composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Provar identidade instalada, banco e rollback
        run: |
          set -euo pipefail
          ./vendor/bin/phpunit tests/Unit/InstalledReleaseIdentityTest.php tests/Unit/AppVersionServiceIdentityTest.php

  develop-compatibility:
    name: Compatibilidade main para develop
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simular a sincronizacao com a develop atual sem publicar
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          sync_dir="$RUNNER_TEMP/version-identity-sync"
          mkdir -p "$sync_dir"
          cp scripts/ui/merge-main-version-identity.sh scripts/ui/version-identity-backport.json "$sync_dir/"
          git fetch --no-tags origin refs/heads/develop:refs/remotes/origin/develop
          develop_before=$(git rev-parse origin/develop)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B identity-sync-candidate origin/develop
          bash "$sync_dir/merge-main-version-identity.sh" "$candidate" "test(identity): simulate main into develop"
          {
            echo '## Simulacao local main → develop'
            echo "- Candidato main: $candidate"
            echo "- Develop comparada: $develop_before"
            echo "- Resultado local: $(git rev-parse HEAD)"
            echo '- Nenhum push ou release executado por este job.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo_sqlite, mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip, bcmath, soap
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-release-identity-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-release-identity-

      - name: Instalar dependencias do candidato combinado
        env:
          PHPCLASSES_TOKEN: ${{ secrets.PHPCLASSES_TOKEN }}
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_NO_AUDIT: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PHPCLASSES_TOKEN:-}" ]; then
            export COMPOSER_AUTH="$(python3 - <<'PY'
          import json, os
          credentials = {"username": "wkarts", "password": os.environ["PHPCLASSES_TOKEN"]}
          print(json.dumps({"http-basic": {host: credentials for host in ["www.phpclasses.org", "phpclasses.org"]}}))
          PY
          )"
          fi
          composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Validar identidades estavel e beta no resultado da fusao
        run: |
          set -euo pipefail
          ./vendor/bin/phpunit tests/Unit/InstalledReleaseIdentityTest.php tests/Unit/AppVersionServiceIdentityTest.php
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
          python3 tests/ui/test-release-identity.py
          python3 tests/ui/test-main-version-identity-sync.py
