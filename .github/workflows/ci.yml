name: CI

on:
  push:
    branches: ["main", "master", "develop", "homolog", "staging"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fersoft_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fersoft_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TEST_DB_CONNECTION: mysql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_DATABASE: fersoft_test
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: pdo_mysql, mbstring, intl, json, openssl, curl, dom, gd, fileinfo, zip
          coverage: none

      - name: Versions
        run: |
          php -v
          composer -V

      # Exporta Secrets -> ENV do job
      # OBS: em PR de fork, secrets vêm vazios por padrão do GitHub; o bootstrap gera chaves mesmo assim.
      - name: Export Secrets to ENV
        shell: bash
        run: |
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> $GITHUB_ENV

          echo "PHPCLASSES_TOKEN=${{ secrets.PHPCLASSES_TOKEN }}" >> $GITHUB_ENV
          echo "REPOSITORY_PERSONAL_TOKEN=${{ secrets.REPOSITORY_PERSONAL_TOKEN }}" >> $GITHUB_ENV

          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $GITHUB_ENV
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> $GITHUB_ENV
          echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> $GITHUB_ENV
          echo "SMTP_TO=${{ secrets.SMTP_TO }}" >> $GITHUB_ENV

          echo "WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}" >> $GITHUB_ENV
          echo "WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}" >> $GITHUB_ENV

          echo "REVERB_APP=${{ secrets.REVERB_APP }}" >> $GITHUB_ENV
          echo "REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}" >> $GITHUB_ENV
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> $GITHUB_ENV
          echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> $GITHUB_ENV
          echo "REVERB_HOST=${{ secrets.REVERB_HOST }}" >> $GITHUB_ENV
          echo "REVERB_PORT=${{ secrets.REVERB_PORT }}" >> $GITHUB_ENV
          echo "REVERB_SCHEME=${{ secrets.REVERB_SCHEME }}" >> $GITHUB_ENV
          echo "REVERB_SERVER=${{ secrets.REVERB_SERVER }}" >> $GITHUB_ENV
          echo "REVERB_SERVER_HOST=${{ secrets.REVERB_SERVER_HOST }}" >> $GITHUB_ENV
          echo "REVERB_SERVER_PORT=${{ secrets.REVERB_SERVER_PORT }}" >> $GITHUB_ENV

          echo "PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" >> $GITHUB_ENV
          echo "PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}" >> $GITHUB_ENV
          echo "PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}" >> $GITHUB_ENV
          echo "VITE_PUSHER_APP_CLUSTER=${{ secrets.VITE_PUSHER_APP_CLUSTER }}" >> $GITHUB_ENV
          echo "VITE_PUSHER_APP_KEY=${{ secrets.VITE_PUSHER_APP_KEY }}" >> $GITHUB_ENV
          echo "VITE_PUSHER_HOST=${{ secrets.VITE_PUSHER_HOST }}" >> $GITHUB_ENV
          echo "VITE_PUSHER_PORT=${{ secrets.VITE_PUSHER_PORT }}" >> $GITHUB_ENV
          echo "VITE_PUSHER_SCHEME=${{ secrets.VITE_PUSHER_SCHEME }}" >> $GITHUB_ENV
          echo "VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}" >> $GITHUB_ENV
          echo "VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}" >> $GITHUB_ENV
          echo "VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}" >> $GITHUB_ENV
          echo "VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}" >> $GITHUB_ENV

          echo "CONNECT_API_BASE_URL=${{ secrets.CONNECT_API_BASE_URL }}" >> $GITHUB_ENV
          echo "CONNECT_API_BOOTSTRAP_KEY=${{ secrets.CONNECT_API_BOOTSTRAP_KEY }}" >> $GITHUB_ENV
          echo "CONNECT_API_DDI=${{ secrets.CONNECT_API_DDI }}" >> $GITHUB_ENV
          echo "CONNECT_API_DDD=${{ secrets.CONNECT_API_DDD }}" >> $GITHUB_ENV
          echo "CONNECT_API_INSTANCE_PREFIX=${{ secrets.CONNECT_API_INSTANCE_PREFIX }}" >> $GITHUB_ENV
          echo "CONNECT_API_WEBHOOK_SECRET=${{ secrets.CONNECT_API_WEBHOOK_SECRET }}" >> $GITHUB_ENV
          echo "CONNECT_API_WEBHOOK_URL=${{ secrets.CONNECT_API_WEBHOOK_URL }}" >> $GITHUB_ENV
          echo "CONNECT_API_WHATSAPP_MODAL_HINTBUTTON=${{ secrets.CONNECT_API_WHATSAPP_MODAL_HINTBUTTON }}" >> $GITHUB_ENV
          echo "CONNECT_API_WHATSAPP_MODAL_TITLE=${{ secrets.CONNECT_API_WHATSAPP_MODAL_TITLE }}" >> $GITHUB_ENV
          echo "CONNECT_API_WHATSAPP_MODAL_HINTFOOTER=${{ secrets.CONNECT_API_WHATSAPP_MODAL_HINTFOOTER }}" >> $GITHUB_ENV

      # Gera .env COMPLETO e aplica overrides seguros para o banco configurado no CI
      - name: Bootstrap .env (integral) for CI
        shell: bash
        run: |
          chmod +x scripts/ci/bootstrap-env.sh
          scripts/ci/bootstrap-env.sh

      # Composer auth do PHPClasses (só se token existir)
      - name: Configure PHPClasses Auth (COMPOSER_AUTH)
        shell: bash
        run: |
          if [ -n "${PHPCLASSES_TOKEN:-}" ]; then
            echo 'COMPOSER_AUTH={"http-basic":{"www.phpclasses.org":{"username":"wkarts","password":"'"${PHPCLASSES_TOKEN}"'"},"phpclasses.org":{"username":"wkarts","password":"'"${PHPCLASSES_TOKEN}"'"}}}' >> $GITHUB_ENV
          else
            echo "PHPCLASSES_TOKEN vazio. Seguindo sem COMPOSER_AUTH (ok para CI quando secrets não estiverem disponíveis)."
          fi

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php82-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel (MySQL 8)
        shell: bash
        run: |
          php artisan key:generate --force || true
          php artisan config:clear || true
          php artisan cache:clear || true
          echo "As migrations do banco de teste serão executadas pelo RefreshDatabase/PHPUnit."

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
        run: |
          ./vendor/bin/phpunit
